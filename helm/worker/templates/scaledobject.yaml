apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: worker-kafka-lag
spec:
  scaleTargetRef: { name: worker }
  minReplicaCount: 1
  maxReplicaCount: 10
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: {{ .Values.global.kafkaBootstrap | quote }}
        consumerGroup: order-worker
        topic: {{ .Values.global.orderTopic | quote }}
        lagThreshold: "20"
